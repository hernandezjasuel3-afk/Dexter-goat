<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dexter Code - Administrador</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0b0f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: #15151e;
      border: 1px solid #29293a;
      border-radius: 18px;
      padding: 30px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #888899;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border-radius: 10px;
      border: 1px solid #29293a;
      background: #0f0f15;
      color: white;
      outline: none;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #5865f2;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #4752c4;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      color: #ff7777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>DEXTER CODE</h1>

    <div class="subtitle">
      Panel de administrador
    </div>

    <form id="loginForm">

      <label for="email">
        Correo electrónico
      </label>

      <input
        id="email"
        type="email"
        placeholder="Tu correo"
        required
      >

      <label for="password">
        Contraseña
      </label>

      <input
        id="password"
        type="password"
        placeholder="Tu contraseña"
        required
      >

      <button type="submit">
        🔐 Iniciar sesión
      </button>

    </form>

    <div id="message"></div>

  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = "https://pcvvfjaoqfgklkefxxrc.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBjdnZmamFvcWZna2xrZWZ4eHJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1NTk0NjksImV4cCI6MjEwNjEzNTQ2OX0.5nLp2iaS8ABbODen78F0eGHdHD2Uf6-gYsIt_3UsT5M";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const loginForm = document.getElementById("loginForm");
  const message = document.getElementById("message");

  loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    message.textContent = "Iniciando sesión...";

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {
      message.textContent = "❌ " + error.message;
      return;
    }

    window.location.href = "admin.html";
  });
</script></body>
</html>
