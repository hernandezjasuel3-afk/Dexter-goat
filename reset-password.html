<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambiar contraseña - Dexter Mods</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b12;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      width: 90%;
      max-width: 400px;
      background: #151522;
      padding: 25px;
      border-radius: 16px;
      border: 1px solid #29294a;
      text-align: center;
    }

    h1 {
      color: #7c5cff;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      box-sizing: border-box;
      border-radius: 10px;
      border: 1px solid #34345a;
      background: #0b0b12;
      color: white;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      background: #7c5cff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>DEXTER MODS</h1>

    <p>Cambiar contraseña</p>

    <input
      type="password"
      id="password"
      placeholder="Nueva contraseña"
    >

    <input
      type="password"
      id="confirmPassword"
      placeholder="Repite la contraseña"
    >

    <button id="changePassword">
      Cambiar contraseña
    </button>

    <div id="message"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://pcvvfjaoqfgklkefxxrc.supabase.co/rest/v1/";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBjdnZmamFvcWZna2xrZWZ4eHJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1NTk0NjksImV4cCI6MjEwNjEzNTQ2OX0.5nLp2iaS8ABbODen78F0eGHdHD2Uf6-gYsIt_3UsT5M";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    document
      .getElementById("changePassword")
      .addEventListener("click", async () => {

        const password =
          document.getElementById("password").value;

        const confirmPassword =
          document.getElementById("confirmPassword").value;

        const message =
          document.getElementById("message");

        if (!password || !confirmPassword) {
          message.textContent =
            "❌ Completa los dos campos.";
          return;
        }

        if (password !== confirmPassword) {
          message.textContent =
            "❌ Las contraseñas no coinciden.";
          return;
        }

        if (password.length < 6) {
          message.textContent =
            "❌ La contraseña debe tener al menos 6 caracteres.";
          return;
        }

        const { error } =
          await supabaseClient.auth.updateUser({
            password: password
          });

        if (error) {
          message.textContent =
            "❌ " + error.message;
          return;
        }

        message.textContent =
          "✅ Contraseña cambiada correctamente.";

        setTimeout(() => {
          window.location.href = "login.html";
        }, 1500);
      });
  </script>

</body>
</html>
