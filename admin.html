<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel - Dexter Mods</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #0b0b12;
      color: white;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      color: #7c5cff;
      text-align: center;
    }

    .box {
      background: #151522;
      border: 1px solid #29294a;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 25px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border-radius: 10px;
      border: 1px solid #34345a;
      background: #0b0b12;
      color: white;
      font-size: 15px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 15px;
      cursor: pointer;
      font-weight: bold;
      color: white;
      margin: 4px;
    }

    #upload {
      background: #7c5cff;
      width: 100%;
      margin-top: 10px;
    }

    #logout {
      background: #e53935;
      width: 100%;
      margin-top: 10px;
    }

    .file-card {
      background: #10101a;
      border: 1px solid #29294a;
      border-radius: 14px;
      padding: 15px;
      margin-top: 12px;
    }

    .file-card h3 {
      margin-top: 0;
      color: white;
    }

    .status {
      color: #9f8cff;
      margin: 8px 0;
    }

    .publish {
      background: #20a060;
    }

    .hide {
      background: #d88900;
    }

    .delete {
      background: #d32f2f;
    }

    #message {
      text-align: center;
      margin-top: 12px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>DEXTER MODS</h1>

  <div class="box">

    <h2>⬆️ Subir archivo</h2>

    <input
      type="text"
      id="name"
      placeholder="Nombre del archivo"
    >

    <textarea
      id="description"
      placeholder="Descripción"
    ></textarea>

    <input
      type="text"
      id="category"
      placeholder="Categoría"
    >

    <label>Imagen:</label>
    <input
      type="file"
      id="image"
      accept="image/*"
    >

    <label>Archivo:</label>
    <input
      type="file"
      id="file"
    >

    <button id="upload">
      ⬆️ Subir archivo
    </button>

    <div id="message"></div>

  </div>

  <div class="box">

    <h2>📁 Mis archivos</h2>

    <div id="fileList">
      Cargando archivos...
    </div>

  </div>

  <button id="logout">
    🚪 Cerrar sesión
  </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://pcvvfjaoqfgklkefxxrc.supabase.co";

const SUPABASE_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBjdnZmamFvcWZna2xrZWZ4eHJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1NTk0NjksImV4cCI6MjEwNjEzNTQ2OX0.5nLp2iaS8ABbODen78F0eGHdHD2Uf6-gYsIt_3UsT5M";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

const message =
  document.getElementById("message");

const uploadButton =
  document.getElementById("upload");

const fileList =
  document.getElementById("fileList");


async function checkLogin() {

  const { data } =
    await supabaseClient.auth.getSession();

  if (!data.session) {

    window.location.href =
      "login.html";

    return false;
  }

  return true;
}


checkLogin();


document
  .getElementById("logout")
  .addEventListener("click", async () => {

    await supabaseClient.auth.signOut();

    window.location.href =
      "login.html";

  });


uploadButton
  .addEventListener("click", async () => {

    const loggedIn =
      await checkLogin();

    if (!loggedIn) return;


    const name =
      document
        .getElementById("name")
        .value
        .trim();

    const description =
      document
        .getElementById("description")
        .value
        .trim();

    const category =
      document
        .getElementById("category")
        .value
        .trim();

    const imageFile =
      document
        .getElementById("image")
        .files[0];

    const mainFile =
      document
        .getElementById("file")
        .files[0];


    if (!name || !mainFile) {

      message.textContent =
        "❌ Escribe un nombre y selecciona un archivo.";

      return;
    }


    uploadButton.disabled = true;

    uploadButton.textContent =
      "Subiendo...";

    message.textContent = "";


    try {

      const fileName =
        Date.now() +
        "-" +
        mainFile.name.replace(/\s+/g, "-");

      const filePath =
        "downloads/" +
        fileName;


      const { error: fileError } =
        await supabaseClient
          .storage
          .from("files")
          .upload(
            filePath,
            mainFile
          );


      if (fileError)
        throw fileError;


      let imageUrl = "";


      if (imageFile) {

        const imageName =
          Date.now() +
          "-image-" +
          imageFile.name.replace(/\s+/g, "-");

        const imagePath =
          "images/" +
          imageName;


        const { error: imageError } =
          await supabaseClient
            .storage
            .from("files")
            .upload(
              imagePath,
              imageFile
            );


        if (imageError)
          throw imageError;


        const { data: imageData } =
          supabaseClient
            .storage
            .from("files")
            .getPublicUrl(
              imagePath
            );


        imageUrl =
          imageData.publicUrl;
      }


      const { data: publicFile } =
        supabaseClient
          .storage
          .from("files")
          .getPublicUrl(
            filePath
          );


      const fileUrl =
        publicFile.publicUrl;


      const { error: databaseError } =
        await supabaseClient
          .from("files")
          .insert({

            name: name,

            description: description,

            category: category,

            file_url: fileUrl,

            image_url: imageUrl,

            downloads: 0,

            published: false

          });


      if (databaseError)
        throw databaseError;


      message.textContent =
        "✅ Archivo subido correctamente.";

      document
        .getElementById("name")
        .value = "";

      document
        .getElementById("description")
        .value = "";

      document
        .getElementById("category")
        .value = "";

      document
        .getElementById("image")
        .value = "";

      document
        .getElementById("file")
        .value = "";


      loadFiles();

    }

    catch (error) {

      console.error(error);

      message.textContent =
        "❌ Error: " +
        error.message;

    }

    finally {

      uploadButton.disabled = false;

      uploadButton.textContent =
        "⬆️ Subir archivo";

    }

  });


async function loadFiles() {

  const { data, error } =
    await supabaseClient
      .from("files")
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    fileList.innerHTML =
      "❌ Error al cargar archivos.";

    console.error(error);

    return;
  }


  if (!data || data.length === 0) {

    fileList.innerHTML =
      "No hay archivos.";

    return;
  }


  fileList.innerHTML = "";


  data.forEach(file => {

    const card =
      document.createElement("div");

    card.className =
      "file-card";


    card.innerHTML = `

      <h3>
        ${file.name}
      </h3>

      <p>
        ${file.description || ""}
      </p>

      <p>
        Categoría:
        ${file.category || "Sin categoría"}
      </p>

      <div class="status">
        Estado:
        ${
          file.published
            ? "🟢 Publicado"
            : "🔴 Oculto"
        }
      </div>

      <button
        class="${
          file.published
            ? "hide"
            : "publish"
        }"
        onclick="togglePublish(
          '${file.id}',
          ${file.published}
        )"
      >
        ${
          file.published
            ? "🔴 Ocultar"
            : "🟢 Publicar"
        }
      </button>

      <button
        class="delete"
        onclick="deleteFile(
          '${file.id}'
        )"
      >
        🗑️ Eliminar
      </button>

    `;


    fileList.appendChild(card);

  });

}


async function togglePublish(
  id,
  currentStatus
) {

  const { error } =
    await supabaseClient
      .from("files")
      .update({
        published:
          !currentStatus
      })
      .eq(
        "id",
        id
      );


  if (error) {

    alert(
      "Error: " +
      error.message
    );

    return;
  }


  loadFiles();

}


async function deleteFile(id) {

  const confirmDelete =
    confirm(
      "¿Seguro que quieres eliminar este archivo?"
    );


  if (!confirmDelete)
    return;


  const { error } =
    await supabaseClient
      .from("files")
      .delete()
      .eq(
        "id",
        id
      );


  if (error) {

    alert(
      "Error: " +
      error.message
    );

    return;
  }


  loadFiles();

}


loadFiles();

</script>

</body>
</html>
