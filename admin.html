<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dexter Code - Panel</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #0b0b0f;
      color: white;
      min-height: 100vh;
    }

    header {
      background: #111118;
      border-bottom: 1px solid #29293a;
      padding: 18px;
    }

    .header-content {
      width: 92%;
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .logout {
      background: #29293a;
      color: white;
      border: 0;
      border-radius: 9px;
      padding: 10px 14px;
      cursor: pointer;
    }

    .container {
      width: 92%;
      max-width: 1100px;
      margin: 25px auto;
    }

    .panel {
      background: #15151e;
      border: 1px solid #29293a;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    h1 {
      margin-top: 0;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-size: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #29293a;
      background: #0f0f15;
      color: white;
      outline: none;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      margin-top: 18px;
      padding: 13px 18px;
      border: 0;
      border-radius: 10px;
      background: #5865f2;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #4752c4;
    }

    .file-item {
      background: #101017;
      border: 1px solid #29293a;
      border-radius: 12px;
      padding: 15px;
      margin-top: 12px;
    }

    .status {
      display: inline-block;
      padding: 5px 8px;
      border-radius: 7px;
      font-size: 12px;
      margin-top: 8px;
    }

    .published {
      background: #193b27;
      color: #7dffa5;
    }

    .hidden {
      background: #3b3030;
      color: #ff9a9a;
    }

    #message {
      margin-top: 15px;
      color: #aaaabb;
    }
  </style>
</head>

<body>

  <header>
    <div class="header-content">

      <div class="logo">
        DEXTER CODE
      </div>

      <button class="logout" id="logout">
        Cerrar sesión
      </button>

    </div>
  </header>

  <main class="container">

    <div class="panel">

      <h1>
        Panel de administrador
      </h1>

      <p>
        Desde aquí podrás administrar tus archivos.
      </p>

    </div>

    <div class="panel">

      <h2>
        ➕ Subir archivo
      </h2>

      <label>
        Nombre del archivo
      </label>

      <input
        id="name"
        type="text"
        placeholder="Ej. Minecraft Mod"
      >

      <label>
        Descripción
      </label>

      <textarea
        id="description"
        placeholder="Escribe una descripción"
      ></textarea>

      <label>
        Categoría
      </label>

      <input
        id="category"
        type="text"
        placeholder="Ej. Mods"
      >

      <label>
        Imagen
      </label>

      <input
        id="image"
        type="file"
        accept="image/*"
      >

      <label>
        Archivo para descargar
      </label>

      <input
        id="file"
        type="file"
      >

      <button id="upload">
        ⬆️ Subir archivo
      </button>

      <div id="message"></div>

    </div>

    <div class="panel">

      <h2>
        📁 Mis archivos
      </h2>

      <div id="fileList">
        Cargando...
      </div>

    </div>

  </main>

</body>
</html>
