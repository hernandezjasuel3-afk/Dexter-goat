<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dexter Code - Panel</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #0b0b0f;
      color: white;
      min-height: 100vh;
    }

    header {
      background: #111118;
      border-bottom: 1px solid #29293a;
      padding: 18px;
    }

    .header-content {
      width: 92%;
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .logout {
      background: #29293a;
      color: white;
      border: 0;
      border-radius: 9px;
      padding: 10px 14px;
      cursor: pointer;
    }

    .container {
      width: 92%;
      max-width: 1100px;
      margin: 25px auto;
    }

    .panel {
      background: #15151e;
      border: 1px solid #29293a;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    h1 {
      margin-top: 0;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-size: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #29293a;
      background: #0f0f15;
      color: white;
      outline: none;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      margin-top: 18px;
      padding: 13px 18px;
      border: 0;
      border-radius: 10px;
      background: #5865f2;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #4752c4;
    }

    .file-item {
      background: #101017;
      border: 1px solid #29293a;
      border-radius: 12px;
      padding: 15px;
      margin-top: 12px;
    }

    .status {
      display: inline-block;
      padding: 5px 8px;
      border-radius: 7px;
      font-size: 12px;
      margin-top: 8px;
    }

    .published {
      background: #193b27;
      color: #7dffa5;
    }

    .hidden {
      background: #3b3030;
      color: #ff9a9a;
    }

    #message {
      margin-top: 15px;
      color: #aaaabb;
    }
  </style>
</head>

<body>

  <header>
    <div class="header-content">

      <div class="logo">
        DEXTER CODE
      </div>

      <button class="logout" id="logout">
        Cerrar sesión
      </button>

    </div>
  </header>

  <main class="container">

    <div class="panel">

      <h1>
        Panel de administrador
      </h1>

      <p>
        Desde aquí podrás administrar tus archivos.
      </p>

    </div>

    <div class="panel">

      <h2>
        ➕ Subir archivo
      </h2>

      <label>
        Nombre del archivo
      </label>

      <input
        id="name"
        type="text"
        placeholder="Ej. Minecraft Mod"
      >

      <label>
        Descripción
      </label>

      <textarea
        id="description"
        placeholder="Escribe una descripción"
      ></textarea>

      <label>
        Categoría
      </label>

      <input
        id="category"
        type="text"
        placeholder="Ej. Mods"
      >

      <label>
        Imagen
      </label>

      <input
        id="image"
        type="file"
        accept="image/*"
      >

      <label>
        Archivo para descargar
      </label>

      <input
        id="file"
        type="file"
      >

      <button id="upload">
        ⬆️ Subir archivo
      </button>

      <div id="message"></div>

    </div>

    <div class="panel">

      <h2>
        📁 Mis archivos
      </h2>

      <div id="fileList">
        Cargando...
      </div>

    </div>

  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = "https://pcvvfjaoqfgklkefxxrc.supabase.co/rest/v1/";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBjdnZmamFvcWZna2xrZWZ4eHJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1NTk0NjksImV4cCI6MjEwNjEzNTQ2OX0.5nLp2iaS8ABbODen78F0eGHdHD2Uf6-gYsIt_3UsT5M";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const message = document.getElementById("message");
  const uploadButton = document.getElementById("upload");

  async function checkLogin() {
    const { data } = await supabaseClient.auth.getSession();

    if (!data.session) {
      window.location.href = "login.html";
      return false;
    }

    return true;
  }

  checkLogin();

  document.getElementById("logout").addEventListener("click", async () => {
    await supabaseClient.auth.signOut();
    window.location.href = "login.html";
  });

  uploadButton.addEventListener("click", async () => {

    const loggedIn = await checkLogin();

    if (!loggedIn) return;

    const name = document.getElementById("name").value.trim();
    const description = document.getElementById("description").value.trim();
    const category = document.getElementById("category").value.trim();

    const imageFile = document.getElementById("image").files[0];
    const mainFile = document.getElementById("file").files[0];

    if (!name || !mainFile) {
      message.textContent =
        "❌ Escribe un nombre y selecciona un archivo.";
      return;
    }

    uploadButton.disabled = true;
    uploadButton.textContent = "Subiendo...";
    message.textContent = "";

    try {

      const fileName =
        Date.now() + "-" + mainFile.name.replace(/\s+/g, "-");

      const filePath = "downloads/" + fileName;

      const { error: fileError } =
        await supabaseClient.storage
          .from("files")
          .upload(filePath, mainFile);

      if (fileError) {
        throw fileError;
      }

      let imageUrl = "";

      if (imageFile) {

        const imageName =
          Date.now() + "-image-" +
          imageFile.name.replace(/\s+/g, "-");

        const imagePath = "images/" + imageName;

        const { error: imageError } =
          await supabaseClient.storage
            .from("files")
            .upload(imagePath, imageFile);

        if (imageError) {
          throw imageError;
        }

        const { data: imageData } =
          supabaseClient.storage
            .from("files")
            .getPublicUrl(imagePath);

        imageUrl = imageData.publicUrl;
      }

      const { data: publicFile } =
        supabaseClient.storage
          .from("files")
          .getPublicUrl(filePath);

      const fileUrl = publicFile.publicUrl;

      const { error: databaseError } =
        await supabaseClient
          .from("files")
          .insert({
            name: name,
            description: description,
            category: category,
            file_url: fileUrl,
            image_url: imageUrl,
            downloads: 0,
            published: false
          });

      if (databaseError) {
        throw databaseError;
      }

      message.textContent =
        "✅ Archivo subido correctamente. Está oculto hasta que lo publiques.";

      document.getElementById("name").value = "";
      document.getElementById("description").value = "";
      document.getElementById("category").value = "";
      document.getElementById("image").value = "";
      document.getElementById("file").value = "";

    } catch (error) {

      console.error(error);

      message.textContent =
        "❌ Error: " + error.message;

    } finally {

      uploadButton.disabled = false;
      uploadButton.textContent = "⬆️ Subir archivo";
    }

  });
</script>

</html>
